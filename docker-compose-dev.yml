version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bench-management-mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3527}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: bench_management
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bench-network

  redis:
    image: redis:7
    container_name: bench-management-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6627}:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - bench-network

  backend:
    image: qd-127-backend:latest
    container_name: bench-management-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8327}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    networks:
      - bench-network

  frontend:
    image: qd-127-frontend:latest
    container_name: bench-management-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8227}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - bench-network

volumes:
  mysql_data_dev:
  redis_data_dev:

networks:
  bench-network:
    driver: bridge
