version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bench-management-mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3527}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: bench_management
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bench-network
    restart: always

  redis:
    image: redis:7
    container_name: bench-management-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6627}:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - bench-network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: bench-management-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8327}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    networks:
      - bench-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: bench-management-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8227}:80"
    depends_on:
      - backend
    networks:
      - bench-network
    restart: always

volumes:
  mysql_data_prod:
  redis_data_prod:

networks:
  bench-network:
    driver: bridge
