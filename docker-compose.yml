services:
  mysql:
    image: mysql:8.0
    container_name: bench-management-mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3527}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bench_management}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --performance-schema=OFF --innodb-buffer-pool-size=64M --max-connections=50
    restart: unless-stopped
    networks:
      - bench-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-admin123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: bench-management-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6627}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - bench-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bench-management-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8327}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bench-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bench-management-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8227}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - bench-network

volumes:
  mysql_data:
  redis_data:

networks:
  bench-network:
    driver: bridge
